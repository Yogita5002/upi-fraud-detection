server.port=${PORT:8080}

# PostgreSQL — reads from environment variables in production,
# falls back to the local Docker container for local development
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/frauddb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:fraud_user}
spring.datasource.password=${DB_PASSWORD:fraud_pass}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging
logging.level.com.frauddetection=INFO
